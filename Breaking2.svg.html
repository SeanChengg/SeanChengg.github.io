<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link rel="stylesheet" href="./shared.css" />
    <link rel="stylesheet" href="./index.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Wallpoet:wght@400&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yeseva+One:wght@400&display=swap" />
  
  <style>
    /* Reset all margins and paddings */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      background: #F6F2E8;
      color: #333;
      font-family: 'Poppins', sans-serif;
      width: 100%;
      height: 100%;
      position: fixed;
      overflow: hidden;
    }
    
    /* The frame that contains everything */
    .frame {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    
        /* Group parent styles */
        .group-parent {
            width: 1920px;
            height: 1080px;
            position: absolute;
            background-color: #f6f2e8;
            overflow: hidden;
            text-align: left;
            font-size: 60px;
            color: #101420;
            font-family: 'Yeseva One';
            transform-origin: top left;
        }

        .breaking-bad {
            position: absolute;
            top: 45px;
            left: 398px;
            display: inline-block;
            width: 1462px;
            height: 99px;
        }

        .frame-child {
            position: absolute;
            top: 96px;
            left: 35px;
            background-color: #101420;
            width: 363px;
            height: 4px;
    }
    
        .div {
      position: absolute;
            top: 140px;
            left: 130px;
            font-size: 120px;
            font-weight: 300;
            font-family: 'Open Sans';
            display: inline-block;
            width: 148px;
            height: 163px;
            opacity: 0.1;
    }
    
        /* Video container */
    .video-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 68%;
      height: auto;
      z-index: 5;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.35);
      border-radius: 8px;
      overflow: hidden;
    }
    
        video {
      width: 100%;
      height: 100%;
      display: block;
      background-color: #000;
    }
    
    /* Navigation styles */
    .nav-container {
      position: absolute;
      bottom: 40px;
      right: 32px;
      z-index: 10;
            pointer-events: auto;
            transform-origin: bottom right;
    }
    
    .next-container {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 20px;
      margin-right: 30px;
    }
    
    .prev-container {
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }
    
    .nav-btn {
      display: inline-block;
      color: #777;
      text-decoration: none;
      font-size: 1.4rem;
      white-space: nowrap;
      transition: all 0.3s ease;
      position: relative;
      font-family: 'Zilla Slab', serif;
      font-weight: 600;
      letter-spacing: 0.5px;
      transform: translateY(0);
    }
    
    .nav-btn:hover {
      color: #555;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.2), 
                  0.5px 0px 0.5px rgba(0, 0, 0, 0.1), 
                  -0.5px 0px 0.5px rgba(0, 0, 0, 0.1);
      transform: translateY(-3px);
    }
    
    .nav-line {
      display: inline-block;
      width: 140px;
      height: 1px;
      background-color: #777;
      position: relative;
      top: 8px;
    }
    
    .next-line {
      margin-right: 8px;
    }
    
    .prev-line {
      margin-left: 8px;
    }
    
        /* Responsive design and narrow screen message */
        .narrow-screen-message {
            display: none;
      position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-family: 'Zilla Slab', serif;
            color: #777;
            font-size: 1.2rem;
            padding: 20px;
            background: rgba(246, 242, 232, 0.9);
            border-radius: 8px;
      z-index: 1000;
            white-space: nowrap;
    }
    
        @media screen and (max-width: 1024px) {
            .narrow-screen-message {
                display: block;
    }
    
            .group-parent {
                opacity: 0.7;
                filter: blur(1px);
                transition: all 0.3s ease;
            }
    }
    
        @media screen and (max-width: 768px) {
            .group-parent {
                opacity: 0.5;
                filter: blur(2px);
            }
    }
  </style>
</head>
<body>
  <div class="frame">
        <div class="group-parent">
            <div class="breaking-bad">Breaking Bad</div>
            <div class="frame-child"></div>
            <div class="div">02</div>
    
    <div class="video-container">
                <video id="breakingVideo" autoplay loop muted playsinline>
        <source src="videos/Breaking.mov" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
    
      <div class="nav-container">
        <div class="next-container">
          <span class="nav-line next-line"></span>
          <a href="index.html" class="nav-btn">Home</a>
        </div>
        <div class="prev-container">
          <a href="Breaking-concept.html" class="nav-btn">Back</a>
          <span class="nav-line prev-line"></span>
        </div>
      </div>
    </div>
  </div>

    <div class="narrow-screen-message">
        View project details on a larger screen
    </div>

    <script src="shared.js"></script>
</body>
</html>
