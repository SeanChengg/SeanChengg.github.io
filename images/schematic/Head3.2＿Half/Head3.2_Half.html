<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width" />
  <title>Head 3.2 Half Opened</title>
  <style>
    html { background-color: transparent; height: 100%; }
    body {
      margin: 0; text-align: center;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; background: transparent;
    }
    #viewer-container {
      display: inline-block; position: relative;
      max-width: 100vw; max-height: 100vh; cursor: grab;
    }
    #viewer-container:active { cursor: grabbing; }
    #viewer {
      max-width: 100vw; max-height: 100vh;
      width: auto; height: auto; object-fit: contain;
      user-select: none; -webkit-user-drag: none;
    }
    .preload { position: absolute; width: 0; height: 0; overflow: hidden; opacity: 0; }
  </style>
</head>
<body>
  <div id="viewer-container">
    <img id="viewer" src="Image%201.png" alt="Head 3.2 Half Opened" />
  </div>
  <div class="preload" id="preloader"></div>
  <script>

        "Image%2098.png",
        "Image%2099.png",
        "Image%20100.png"
      ];
      const totalFrames = frameFiles.length;
      let currentFrame = 0;
      let direction = 1;
      const viewer = document.getElementById("viewer");
      const container = document.getElementById("viewer-container");
      const preloadedImages = [];
      const preloader = document.getElementById("preloader");
      frameFiles.forEach(src => {
        const img = new Image(); img.src = src;
        preloadedImages.push(img); preloader.appendChild(img);
      });
      let isDragging = false, startX = 0, dragAccumulator = 0;
      const sensitivity = 30;
      function onPointerDown(e) {
        isDragging = true;
        startX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
        dragAccumulator = 0; e.preventDefault();
      }
      function onPointerMove(e) {
        if (!isDragging) return;
        const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
        const deltaX = clientX - startX; startX = clientX;
        dragAccumulator += deltaX;
        const framesToMove = Math.floor(dragAccumulator / sensitivity);
        if (framesToMove !== 0) {
          dragAccumulator -= framesToMove * sensitivity;
          currentFrame = ((currentFrame + framesToMove) % totalFrames + totalFrames) % totalFrames;
          viewer.src = frameFiles[currentFrame];
        }
        e.preventDefault();
      }
      function onPointerUp() { isDragging = false; }
      container.addEventListener("mousedown", onPointerDown);
      window.addEventListener("mousemove", onPointerMove);
      window.addEventListener("mouseup", onPointerUp);
      container.addEventListener("touchstart", onPointerDown, { passive: false });
      window.addEventListener("touchmove", onPointerMove, { passive: false });
      window.addEventListener("touchend", onPointerUp);
      let autoRotateInterval = null;
      const autoRotateDelay = 42;
      function startAutoRotate() {
        autoRotateInterval = setInterval(() => {
          currentFrame += direction;
          if (currentFrame >= totalFrames - 1) { currentFrame = totalFrames - 1; direction = -1; }
          if (currentFrame <= 0) { currentFrame = 0; direction = 1; }
          viewer.src = frameFiles[currentFrame];
        }, autoRotateDelay);
      }
      function stopAutoRotate() {
        if (autoRotateInterval) { clearInterval(autoRotateInterval); autoRotateInterval = null; }
      }
      container.addEventListener("mousedown", stopAutoRotate);
      container.addEventListener("touchstart", stopAutoRotate);
      let loadedCount = 0;
      preloadedImages.forEach(img => {
        if (img.complete) { loadedCount++; if (loadedCount === totalFrames) startAutoRotate(); }
        else { img.addEventListener("load", () => { loadedCount++; if (loadedCount === totalFrames) startAutoRotate(); }); }
      });
    })();
  </script>
</body>
</html>
