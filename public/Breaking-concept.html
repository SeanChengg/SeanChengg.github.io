<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Breaking Bad - Page 1</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      background: #F6F2E8;
      color: #333;
      font-family: 'Poppins', sans-serif;
      width: 100%;
      height: 100%;
      position: fixed;
      overflow: hidden;
    }
    
    .frame {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    
    .svg-container {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 105vw;
      height: 105vh;
      z-index: 1;
      pointer-events: none;
    }
    
    .embedded-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    
    .nav-container {
      position: absolute;
      bottom: 18px;
      right: 32px;
      z-index: 10;
    }
    
    .next-container {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 15px;
    }
    
    .prev-container {
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }
    
    .nav-btn {
      display: inline-block;
      color: #777;
      text-decoration: none;
      font-size: 1.1rem;
      white-space: nowrap;
      transition: all 0.3s ease;
      font-family: 'Zilla Slab', serif;
      font-weight: 600;
    }
    
    .nav-btn:hover {
      color: #555;
    }
    
    .nav-line {
      display: inline-block;
      width: 120px;
      height: 1px;
      background-color: #777;
      margin: 0 5px;
    }
    
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #F6F2E8;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.5s ease;
    }
    
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(0, 0, 0, 0.1);
      border-radius: 50%;
      border-top-color: #777;
      animation: spin 1s ease-in-out infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-spinner"></div>
  </div>

  <div class="frame">
    <div class="svg-container">
      <object class="embedded-svg" type="image/svg+xml" data="images/Breaking.svg"></object>
    </div>
    
    <div class="nav-container">
      <div class="next-container">
        <span class="nav-line"></span>
        <a href="Breaking2.svg.html" class="nav-btn">Next</a>
      </div>
      <div class="prev-container">
        <a href="index.html" class="nav-btn">Back</a>
        <span class="nav-line"></span>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      setTimeout(function() {
        document.getElementById('loadingScreen').style.opacity = 0;
        setTimeout(function() {
          document.getElementById('loadingScreen').style.display = 'none';
        }, 500);
      }, 1000);
      
      // Page transitions
      document.querySelectorAll('.nav-btn').forEach(button => {
        button.addEventListener('click', function(event) {
          event.preventDefault();
          const href = this.getAttribute('href');
          
          document.body.style.opacity = 0;
          setTimeout(() => {
            window.location.href = href;
          }, 300);
        });
      });
      
      // Fade in page
      document.body.style.opacity = 0;
      setTimeout(() => {
        document.body.style.opacity = 1;
      }, 100);
    });
  </script>
</body>
</html>
